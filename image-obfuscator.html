}

function refreshBatchItemEl(item) {
    if (!batchListEl) return;
    const el = batchListEl.querySelector(`[data-id="${item.id}"]`);
    if (!el) return;

    const statusEl = el.querySelector('.batch-status');
    if (statusEl) {
        statusEl.className = 'batch-status ' + item.status;
        statusEl.textContent = BATCH_STATUS_TEXT[item.status] || '';
    }

    const actions = el.querySelector('.batch-item-actions');
    if (actions) {
        actions.textContent = '';

        if (item.status === 'done' && item.url) {
            const btn = document.createElement('button');
            btn.className = 'mini-button';
            btn.textContent = '下载';
            btn.addEventListener('click', () => downloadBatchItem(item));
            actions.appendChild(btn);
        }

        if (item.status === 'error' && item.error) {
            const btn = document.createElement('button');
            btn.className = 'mini-button';
            btn.textContent = '详情';
            btn.addEventListener('click', () => {
                recordError(`处理失败：${item.name}`, item.error);
            });
            actions.appendChild(btn);
        }
    }
}

function addBatchItemEl(item) {
    if (!batchListEl) return;
    batchListEl.appendChild(createBatchItemEl(item));
    refreshBatchItemEl(item);
}

function setBatchItemStatus(item, status) {
    item.status = status;
    refreshBatchItemEl(item);
    updateBatchSummary();
}

function updateBatchSummary() {
    if (!batchCountEl) return;
    const n = state.batchFiles.length;
    let done = 0, failed = 0;
    for (const it of state.batchFiles) {
        if (it.status === 'done') done++;
        else if (it.status === 'error') failed++;
    }
    let text = `共 ${n} 个文件`;
    if (done)   text += ` · 已完成 ${done}`;
    if (failed) text += ` · 失败 ${failed}`;
    batchCountEl.textContent = text;
}

function clearBatchList() {
    if (state.batchProcessing) return;

    for (const item of state.batchFiles) {
        if (item.thumbUrl) { try { URL.revokeObjectURL(item.thumbUrl); } catch { /* ignore */ } }
        if (item.url)      { try { URL.revokeObjectURL(item.url); } catch { /* ignore */ } }
    }
    state.batchFiles = [];
    if (batchListEl) batchListEl.textContent = '';
    updateBatchSummary();
}

function setBatchMode(on) {
    state.batchMode = on;
    if (batchPanel) batchPanel.classList.toggle('visible', on);
    if (singlePanel) singlePanel.style.display = on ? 'none' : '';
    document.body.classList.toggle('batch-mode', on);
}

/* =========================================================================
 * 批量 —— 进度与按钮
 * ========================================================================= */
function showBatchProgress(show) {
    if (batchProgressEl) batchProgressEl.classList.toggle('visible', show);
    if (!show) {
        if (batchProgressFill) batchProgressFill.style.width = '0%';
        if (batchProgressText) batchProgressText.textContent = '';
    }
}

function updateBatchProgress(current, total, text) {
    if (batchProgressFill) {
        batchProgressFill.style.width =
            total > 0 ? (current / total * 100).toFixed(1) + '%' : '0%';
    }
    if (batchProgressText) {
        batchProgressText.textContent =
            `${current} / ${total}` + (text ? ` · ${text}` : '');
    }
}

function setBatchControlsBusy(busy) {
    [batchEncBtn, batchDecBtn, batchDlBtn, batchClearBtn].forEach((b) => {
        if (b) b.classList.toggle('disabled', busy);
    });
    if (batchCancelBtn) batchCancelBtn.classList.toggle('visible', busy);
}

/* =========================================================================
 * 批量 —— 文件 → Image 元素
 * ========================================================================= */
function loadImageElement(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const el = new Image();

        el.onload = () => resolve({ img: el, url });
        el.onerror = () => {
            try { URL.revokeObjectURL(url); } catch { /* ignore */ }
            reject(new Error(`图片解码失败：${file.name}`));
        };

        el.src = url;
    });
}

/* =========================================================================
 * 批量 —— 主流程
 * ========================================================================= */
async function runBatch(mode) {
    if (state.batchProcessing) return;
    if (!state.batchFiles.length) {
        recordError('批量列表为空，请先选择图片');
        return;
    }

    const isEncrypt = mode === 'encrypt';
    const label = isEncrypt ? '批量混淆' : '批量解混淆';
    const total = state.batchFiles.length;

    const settings = {
        encryptStrength: state.encryptStrength,
        decryptStrength: state.decryptStrength,
        enableGreen: !!(enableGreen && enableGreen.checked),
        reduceGreen: !!(reduceGreen && reduceGreen.checked),
        format: formatSelect ? formatSelect.value : 'png',
        quality: qualityRange ? parseInt(qualityRange.value, 10) / 100 : 0.95
    };

    state.batchProcessing = true;
    const controller = new AbortController();
    state.abortController = controller;
    const signal = controller.signal;

    showLoader();
    setBatchControlsBusy(true);
    showBatchProgress(true);
    updateBatchProgress(0, total, '准备中');

    let done = 0;
    let failed = 0;
    let cancelled = false;

    try {
        for (let i = 0; i < total; i++) {
            if (signal.aborted) { cancelled = true; break; }

            const item = state.batchFiles[i];
            if (!item) { cancelled = true; break; }

            updateBatchProgress(i, total, item.name);
            setBatchItemStatus(item, 'processing');

            if (item.url) { try { URL.revokeObjectURL(item.url); } catch { /* ignore */ } }
            item.url = null;
            item.blob = null;
            item.error = null;
            item.outFormat = '';
            refreshBatchItemEl(item);

            let loaded = null;
            try {
                loaded = await loadImageElement(item.file);

                const result = await transformToBlob(
                    loaded.img, mode, signal, item.name, settings
                );

                if (signal.aborted) throw abortError();

                item.blob = result.blob;
                item.url = URL.createObjectURL(result.blob);
                item.mode = mode;
                item.outFormat = result.format;
                setBatchItemStatus(item, 'done');
                done++;
            } catch (e) {
                if (e && e.name === 'AbortError') {
                    setBatchItemStatus(item, 'pending');
                    cancelled = true;
                    break;
                }
                item.error = e;
                setBatchItemStatus(item, 'error');
                failed++;
                recordError(`[${label}] 处理失败：${item.name}`, e, { popup: false });
            } finally {
                if (loaded) {
                    try { loaded.img.onload = loaded.img.onerror = null; } catch { /* ignore */ }
                    try { loaded.img.removeAttribute('src'); } catch { /* ignore */ }
                    try { URL.revokeObjectURL(loaded.url); } catch { /* ignore */ }
                }
            }

            updateBatchProgress(i + 1, total, '');
            await nextFrame();
        }
    } finally {
        state.batchProcessing = false;
        state.abortController = null;
        hideLoader();
        setBatchControlsBusy(false);
        showBatchProgress(false);
        updateBatchSummary();

        if (cancelled) {
            recordError(`[${label}] 已取消（成功 ${done} 个）`, null, { popup: false });
        } else if (failed > 0) {
            recordError(
                `[${label}] 完成：成功 ${done} 个，失败 ${failed} 个`,
                null,
                { popup: true }
            );
        }
    }
}

/* =========================================================================
 * 批量 —— 下载（单项 / 打包 ZIP）
 * ========================================================================= */
function triggerDownload(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
}

function downloadBatchItem(item) {
    if (!item || !item.url) return;

    const ext = item.outFormat || (formatSelect && formatSelect.value === 'jpg' ? 'jpg' : 'png');
    const prefix = item.mode === 'encrypt' ? 'encrypted_' : 'decrypted_';
    const base = (item.name || 'image').replace(/\.[^/.]+$/, '') || 'image';

    try {
        triggerDownload(item.url, `${prefix}${base}.${ext}`);
    } catch (e) {
        recordError('下载失败', e);
    }
}

/* —— 极简 ZIP —— */
const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) {
            c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        t[i] = c >>> 0;
    }
    return t;
})();

function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
        c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    }
    return (c ^ 0xFFFFFFFF) >>> 0;
}

function createZipBlob(entries) {
    const encoder = new TextEncoder();
    const chunks = [];
    const central = [];
    let offset = 0;

    const now = new Date();
    const dosTime = ((now.getHours() << 11) |
                     (now.getMinutes() << 5) |
                     (Math.floor(now.getSeconds() / 2))) & 0xFFFF;
    const dosDate = (((now.getFullYear() - 1980) << 9) |
                     ((now.getMonth() + 1) << 5) |
                     now.getDate()) & 0xFFFF;

    for (const entry of entries) {
        const nameBytes = encoder.encode(entry.name);
        const data = entry.data;
        const size = data.length;
        const crc = crc32(data);

        const local = new Uint8Array(30 + nameBytes.length);
        const lv = new DataView(local.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(6, 0x0800, true);
        lv.setUint16(8, 0, true);
        lv.setUint16(10, dosTime, true);
        lv.setUint16(12, dosDate, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, size, true);
        lv.setUint32(22, size, true);
        lv.setUint16(26, nameBytes.length, true);
        lv.setUint16(28, 0, true);
        local.set(nameBytes, 30);

        chunks.push(local, data);

        const cd = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(cd.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0x0800, true);
        cv.setUint16(10, 0, true);
        cv.setUint16(12, dosTime, true);
        cv.setUint16(14, dosDate, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, size, true);
        cv.setUint32(24, size, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint16(30, 0, true);
        cv.setUint16(32, 0, true);
        cv.setUint16(34, 0, true);
        cv.setUint16(36, 0, true);
        cv.setUint32(38, 0, true);
        cv.setUint32(42, offset, true);
        cd.set(nameBytes, 46);
        central.push(cd);

        offset += local.length + size;
    }

    let centralSize = 0;
    for (const c of central) centralSize += c.length;

    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return new Blob([...chunks, ...central, eocd], { type: 'application/zip' });
}

async function downloadBatch() {
    if (state.batchProcessing) return;

    const doneItems = state.batchFiles.filter((it) => it.status === 'done' && it.blob);
    if (!doneItems.length) {
        recordError('没有可下载的处理结果');
        return;
    }

    const ts = Date.now();
    showLoader();

    try {
        const entries = [];
        const used = new Set();

        for (const it of doneItems) {
            const ext = it.outFormat || 'png';
            const prefix = it.mode === 'encrypt' ? 'encrypted_' : 'decrypted_';
            const base = (it.name || 'image').replace(/\.[^/.]+$/, '') || 'image';

            let name = `${prefix}${base}.${ext}`;
            let n = 1;
            while (used.has(name)) {
                name = `${prefix}${base}_${n++}.${ext}`;
            }
            used.add(name);

            const buf = new Uint8Array(await it.blob.arrayBuffer());
            entries.push({ name, data: buf });
        }

        const zipBlob = createZipBlob(entries);
        const zipUrl = URL.createObjectURL(zipBlob);

        triggerDownload(zipUrl, `batch_${ts}.zip`);
        setTimeout(() => { try { URL.revokeObjectURL(zipUrl); } catch { /* ignore */ } }, 60000);
    } catch (e) {
        recordError('打包下载失败', e);
    } finally {
        hideLoader();
    }
}

/* =========================================================================
 * 单图 —— 下载 / 查看 / 清除
 * ========================================================================= */
function getDownloadFileName() {
    const ext = state.lastOutputFormat ||
        (formatSelect && formatSelect.value === 'jpg' ? 'jpg' : 'png');

    const prefix = state.hasEncrypted ? 'encrypted_'
                 : state.hasDecrypted ? 'decrypted_'
                 : 'image_';
    const ts = Date.now();

    if (state.fileName) {
        const base = state.fileName.replace(/\.[^/.]+$/, '');
        return `${prefix}${base}_${ts}.${ext}`;
    }
    return `${prefix}${ts}.${ext}`;
}

function downloadImage() {
    if (!img || !img.src) {
        recordError('下载失败：当前没有可下载的图片');
        return;
    }
    try {
        triggerDownload(img.src, getDownloadFileName());
    } catch (err) {
        recordError('下载图片时出错', err);
    }
}

function viewImage() {
    if (!img || !img.src) {
        recordError('查看失败：当前没有可查看的图片');
        return;
    }
    try {
        window.open(img.src, '_blank');
    } catch (err) {
        recordError('查看图片时出错', err);
    }
}

function clearSingleImage() {
    if (img) {
        img.onload = img.onerror = null;
        img.removeAttribute('src');
        img.style.display = 'none';
    }

    releaseCurrentBlobUrl();

    state.hasImage = false;
    state.hasEncrypted = false;
    state.hasDecrypted = false;
    state.fileName = '';
    state.originalFile = null;
    state.lastOutputFormat = '';

    resetButtonStates();
    if (clearBtn)    clearBtn.style.display = 'none';
    if (downloadBtn) downloadBtn.style.display = 'none';
    if (viewBtn)     viewBtn.style.display = 'none';

    updateTransformAvailability();
}

function clearImage() {
    cancelCurrentOperation();

    clearSingleImage();
    if (!state.batchProcessing) {
        clearBatchList();
        setBatchMode(false);
    }

    if (ipt) ipt.value = '';
}

/* =========================================================================
 * 文件选择
 * ========================================================================= */
let fileSelectionToken = 0;

async function handleSingleFile(file) {
    const verdict = await validateImageFile(file);

    if (verdict.fatal) {
        recordError(verdict.message, verdict.error);
        return;
    }

    for (const w of verdict.warnings || []) {
        recordError(`[格式警告] ${w}`, null, { popup: false });
    }

    if (state.batchMode) {
        clearBatchList();
        setBatchMode(false);
    }

    resetButtonStates();
    releaseCurrentBlobUrl();

    if (img) img.style.display = 'none';

    state.hasImage = true;
    state.fileName = file.name;
    state.originalFile = file;
    state.lastOutputFormat = '';

    setImageSrc(URL.createObjectURL(file));

    updateTransformAvailability();

    if (clearBtn)    clearBtn.style.display = 'flex';
    if (downloadBtn) downloadBtn.style.display = 'none';
    if (viewBtn)     viewBtn.style.display = 'none';
}

async function handleBatchFiles(files) {
    const remaining = MAX_BATCH_FILES - state.batchFiles.length;
    if (remaining <= 0) {
        recordError(`批量列表已满（上限 ${MAX_BATCH_FILES} 个文件）`);
        return;
    }

    let list = files;
    if (list.length > remaining) {
        recordError(
            `批量列表最多 ${MAX_BATCH_FILES} 个文件，本次仅添加前 ${remaining} 个`,
            null,
            { popup: false }
        );
        list = list.slice(0, remaining);
    }

    const added = [];
    let skipped = 0;

    for (const file of list) {
        try {
            const verdict = await validateImageFile(file);

            if (verdict.fatal) {
                skipped++;
                recordError(`[跳过] ${verdict.message}`, verdict.error, { popup: false });
                continue;
            }

            for (const w of verdict.warnings || []) {
                recordError(`[格式警告] ${w}`, null, { popup: false });
            }

            const item = makeBatchItem(file);
            item.thumbUrl = URL.createObjectURL(file);
            added.push(item);
        } catch (e) {
            skipped++;
            recordError(`[跳过] 校验 ${file.name} 时出错`, e, { popup: false });
        }
    }

    if (!added.length) {
        recordError('没有可添加的图片文件');
        return;
    }

    if (!state.batchMode) {
        clearSingleImage();
        setBatchMode(true);
    }

    for (const item of added) {
        state.batchFiles.push(item);
        addBatchItemEl(item);
    }
    updateBatchSummary();

    if (skipped > 0) {
        recordError(
            `[批量选择] 已跳过 ${skipped} 个文件（格式不受支持或校验失败）`,
            null,
            { popup: true }
        );
    }
}

async function handleFilesSelected(files) {
    const token = ++fileSelectionToken;

    if (!files || !files.length) return;

    if (state.isProcessing || state.batchProcessing) {
        recordError('当前有操作正在进行，无法选择新图片');
        return;
    }

    try {
        if (files.length === 1) {
            await handleSingleFile(files[0]);
        } else {
            await handleBatchFiles(files);
        }
    } catch (e) {
        recordError('处理文件选择时发生未预期异常', e);
    }

    if (token !== fileSelectionToken) return;
}

if (ipt) {
    ipt.addEventListener('change', () => {
        const files = Array.from(ipt.files || []);
        ipt.value = '';
        handleFilesSelected(files);
    });
}

/* =========================================================================
 * 桌面端增强：拖放 / Ctrl+O
 * ========================================================================= */
const isFileDrag = (e) =>
    !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');

let dragDepth = 0;

function setDropOverlay(show) {
    if (dropOverlay) dropOverlay.classList.toggle('visible', show);
}

document.addEventListener('dragenter', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth++;
    setDropOverlay(true);
});

document.addEventListener('dragover', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});

document.addEventListener('dragleave', (e) => {
    if (!isFileDrag(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) setDropOverlay(false);
});

document.addEventListener('drop', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth = 0;
    setDropOverlay(false);

    const files = Array.from(e.dataTransfer.files || []);
    if (files.length) handleFilesSelected(files);
});

document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
    if (String(e.key || '').toLowerCase() !== 'o') return;
    if (!ipt) return;
    e.preventDefault();
    ipt.click();
});

/* =========================================================================
 * 输出格式（自绘下拉）
 * ========================================================================= */
function initFormatSelect() {
    const root    = $('format-select-wrap');
    const native  = $('format-select');
    const trigger = $('format-trigger');
    const menu    = $('format-menu');
    if (!root || !native || !trigger || !menu) return;

    const options = Array.from(menu.querySelectorAll('.select-option'));
    const valueEl = trigger.querySelector('.select-value');
    if (!options.length || !valueEl) return;

    let activeIndex = 0;

    const isOpen = () => root.classList.contains('open');

    function syncFromNative() {
        const current = native.value;
        let label = '';

        options.forEach((opt) => {
            const selected = opt.dataset.value === current;
            opt.classList.toggle('selected', selected);
            opt.setAttribute('aria-selected', selected ? 'true' : 'false');
            if (selected) {
                const span = opt.querySelector('.select-option-label');
                label = span ? span.textContent : opt.textContent;
            }
        });

        valueEl.textContent = label || current;
        activeIndex = Math.max(0, options.findIndex((o) => o.dataset.value === current));
    }

    function highlight(index) {
        if (!options.length) return;
        activeIndex = ((index % options.length) + options.length) % options.length;
        options.forEach((opt, i) => opt.classList.toggle('active', i === activeIndex));
        const el = options[activeIndex];
        if (el && el.id) trigger.setAttribute('aria-activedescendant', el.id);
    }

    function clearHighlight() {
        options.forEach((opt) => opt.classList.remove('active'));
        trigger.removeAttribute('aria-activedescendant');
    }

    function onDocumentPointerDown(e) {
        if (!root.contains(e.target)) close(false);
    }

    function open() {
        if (isOpen()) return;
        root.classList.add('open');
        trigger.setAttribute('aria-expanded', 'true');
        highlight(activeIndex);
        document.addEventListener('pointerdown', onDocumentPointerDown, true);
    }

    function close(focusTrigger) {
        if (!isOpen()) return;
        root.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
        clearHighlight();
        document.removeEventListener('pointerdown', onDocumentPointerDown, true);
        if (focusTrigger) trigger.focus();
    }

    function commit(value) {
        if (native.value !== value) {
            native.value = value;
            native.dispatchEvent(new Event('change', { bubbles: true }));
        }
        syncFromNative();
    }

    trigger.addEventListener('click', () => {
        if (isOpen()) close(false);
        else open();
    });

    trigger.addEventListener('keydown', (e) => {
        switch (e.key) {
            case 'ArrowDown':
                e.preventDefault();
                if (isOpen()) highlight(activeIndex + 1);
                else open();
                break;
            case 'ArrowUp':
                e.preventDefault();
                if (isOpen()) highlight(activeIndex - 1);
                else open();
                break;
            case 'Home':
                if (isOpen()) { e.preventDefault(); highlight(0); }
                break;
            case 'End':
                if (isOpen()) { e.preventDefault(); highlight(options.length - 1); }
                break;
            case 'Enter':
            case ' ':
                e.preventDefault();
                if (isOpen()) {
                    commit(options[activeIndex].dataset.value);
                    close(true);
                } else {
                    open();
                }
                break;
            case 'Escape':
                if (isOpen()) { e.preventDefault(); close(true); }
                break;
            case 'Tab':
                if (isOpen()) close(false);
                break;
        }
    });

    options.forEach((opt, i) => {
        opt.addEventListener('click', () => {
            commit(opt.dataset.value);
            close(true);
        });
        opt.addEventListener('pointerenter', () => {
            if (isOpen()) highlight(i);
        });
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isOpen()) close(false);
    });

    syncFromNative();
}

/* 原生 select 的 change 事件仍用于驱动质量选项显隐 */
if (formatSelect) {
    formatSelect.addEventListener('change', function () {
        if (qualityOption) {
            qualityOption.style.display = this.value === 'jpg' ? 'block' : 'none';
        }
    });
}

/* =========================================================================
 * 质量滑块
 * ========================================================================= */
if (qualityRange) {
    const syncQualityRangeFill = function () {
        const min = Number(qualityRange.min) || 0;
        const max = Number(qualityRange.max) || 100;
        const value = Number(qualityRange.value) || 0;
        const ratio = max > min ? (value - min) / (max - min) : 0;
        qualityRange.style.setProperty('--range-progress', (ratio * 100).toFixed(2) + '%');
    };

    if (qualityValue) qualityValue.textContent = qualityRange.value;
    qualityRange.addEventListener('input', function () {
        if (qualityValue) qualityValue.textContent = this.value;
        syncQualityRangeFill();
    });
    syncQualityRangeFill();
}

/* =========================================================================
 * 强度按钮
 * ========================================================================= */
function initStrengthButtons() {
    const encButtons = document.querySelectorAll('.encrypt-strength-button');
    encButtons.forEach((btn) => {
        btn.addEventListener('click', function () {
            state.encryptStrength = parseFloat(this.dataset.value) || 0;
            encButtons.forEach((b) => b.classList.remove('selected'));
            this.classList.add('selected');
        });
    });

    const decButtons = document.querySelectorAll('.decrypt-strength-button');
    decButtons.forEach((btn) => {
        btn.addEventListener('click', function () {
            state.decryptStrength = parseFloat(this.dataset.value) || 0;
            decButtons.forEach((b) => b.classList.remove('selected'));
            this.classList.add('selected');
        });
    });
}

/* =========================================================================
 * 错误窗口
 * ========================================================================= */
if (errorCloseBtn)  errorCloseBtn.addEventListener('click', closeErrorWindow);
if (errorOkBtn)     errorOkBtn.addEventListener('click', closeErrorWindow);

if (errorOverlay) {
    errorOverlay.addEventListener('click', (e) => {
        if (e.target === errorOverlay) closeErrorWindow();
    });
}

/* =========================================================================
 * 全局错误捕获
 * ========================================================================= */
window.addEventListener('error', (event) => {
    const location = event.filename
        ? `${event.filename}:${event.lineno}:${event.colno}`
        : '未知位置';
    recordError(
        `全局错误: ${event.message || '(无消息)'} @ ${location}`,
        event.error
    );
});

window.addEventListener('unhandledrejection', (event) => {
    event.preventDefault();
    const reason = event.reason;
    if (reason && reason.name === 'AbortError') return;
    recordError('未处理的 Promise 拒绝', reason);
});

/* =========================================================================
 * 页面卸载
 * ========================================================================= */
window.addEventListener('beforeunload', (event) => {
    const busy = state.isProcessing || state.batchProcessing;

    cancelCurrentOperation();
    releaseCurrentBlobUrl();

    if (busy) {
        event.preventDefault();
        event.returnValue = '图片处理正在进行中，确定要离开吗？';
    }
});

/* =========================================================================
 * 初始化
 * ========================================================================= */
initFormatSelect();
initStrengthButtons();
resetButtonStates();
setBatchMode(false);
updateBatchSummary();
updateTransformAvailability();

if (formatSelect && qualityOption) {
    qualityOption.style.display = formatSelect.value === 'jpg' ? 'block' : 'none';
}
</script>
</body>
</html>
